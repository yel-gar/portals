# Minimal nginx config for the SPA: single worker, logs to stdout/stderr.
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 30;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Hashed build assets can be cached forever.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html must never be cached so deploys are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA fallback: unknown paths render the app, not a 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
